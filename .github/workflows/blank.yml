name: Build APK and Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Без этого релиз не создаётся (ошибка 403)
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ChessMaster
  # Версия релиза: v<MAJOR>.<MINOR>.<номер запуска>, например v1.0.7
  VERSION_MAJOR: 1
  VERSION_MINOR: 0

jobs:
  build:
    name: Build APK and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 21 собирает и AGP 8.x, и AGP 9; нужные toolchain подтянет foojay из settings.gradle.kts
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK уже есть на ubuntu-latest: принимаем лицензии и ставим то, что требует проект
      # (compileSdk { version = release(36) { minorApiLevel = 1 } } -> platforms;android-36.1)
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          SM=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -z "$SM" ]; then
            echo "::warning::sdkmanager не найден, полагаемся на авто-загрузку Gradle"
            exit 0
          fi
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1
          set -o pipefail

          B=app/build.gradle.kts
          [ -f "$B" ] || B=app/build.gradle
          LINE=$(grep -hE 'compileSdk' "$B" | head -n1 || true)
          MAJOR=$(echo "$LINE" | grep -oE 'release\([0-9]+\)' | grep -oE '[0-9]+' | head -n1 || true)
          if [ -z "$MAJOR" ]; then MAJOR=$(echo "$LINE" | grep -oE '[0-9]{2}' | head -n1 || true); fi
          MINOR=$(grep -hoE 'minorApiLevel[[:space:]]*=[[:space:]]*[0-9]+' "$B" | grep -oE '[0-9]+$' | head -n1 || true)
          PLAT="android-${MAJOR:-36}"
          if [ -n "$MINOR" ] && [ "$MINOR" != "0" ]; then PLAT="${PLAT}.${MINOR}"; fi
          echo "Нужная платформа: $PLAT"

          for PKG in "platforms;$PLAT" "build-tools;36.0.0"; do
            "$SM" --sdk_root="$SDK" "$PKG" || sudo "$SM" --sdk_root="$SDK" "$PKG" \
              || echo "::warning::Не удалось поставить $PKG, Gradle попробует сам"
          done
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # В репозитории нет gradlew, поэтому версию Gradle подбираем сами
      - name: Detect Gradle version
        id: gv
        run: |
          GV=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GV=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n1)
          fi
          if [ -z "$GV" ]; then
            T=gradle/libs.versions.toml
            AGP=""
            if [ -f "$T" ]; then
              REF=$(grep -E 'com\.android\.application' "$T" | grep -oE 'version\.ref[[:space:]]*=[[:space:]]*"[^"]+"' | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
              if [ -n "$REF" ]; then
                AGP=$(grep -E "^[[:space:]]*${REF}[[:space:]]*=" "$T" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
              fi
              if [ -z "$AGP" ]; then
                AGP=$(grep -hE '^[[:space:]]*(agp|androidGradlePlugin|android-gradle-plugin)[[:space:]]*=' "$T" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
              fi
            fi
            echo "AGP: ${AGP:-не найден}"
            case "$AGP" in
              9.0.*) GV="9.1.0" ;;
              9.*)   GV="9.3.1" ;;   # AGP 9.1.x требует Gradle 9.3.1+
              *)     GV="8.14.3" ;;
            esac
          fi
          echo "Gradle: $GV"
          echo "version=$GV" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      # secrets-gradle-plugin читает .env (а при его отсутствии .env.example).
      # Если задан секрет GEMINI_API_KEY, подставляем его в .env.
      - name: Prepare .env and local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            grep -v '^GEMINI_API_KEY=' .env > .env.tmp || true
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env.tmp
            mv .env.tmp .env
            echo "GEMINI_API_KEY взят из секрета."
          else
            echo "::notice::Секрет GEMINI_API_KEY не задан, используются значения из .env.example"
          fi

      # В проекте missingGoogleServicesStrategy = WARN, поэтому сборка пройдёт и без файла.
      # Но для работы Firebase в приложении нужен настоящий файл: добавьте секрет GOOGLE_SERVICES_JSON.
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "google-services.json уже есть в репозитории."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json взят из секрета."
          else
            echo "::warning::google-services.json нет: сборка пройдёт, но Firebase в APK работать не будет"
          fi

      # Постоянный ключ подписи нужен, чтобы новые APK ставились поверх старых.
      # Положите base64 вашего debug.keystore в секрет DEBUG_KEYSTORE_BASE64.
      - name: Set up debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "debug.keystore взят из секрета."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            echo "debug.keystore восстановлен из debug.keystore.base64."
          elif [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "debug.keystore взят из репозитория."
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Сгенерирован новый debug.keystore."
          fi
          cp ~/.android/debug.keystore debug.keystore

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            CMD=./gradlew
          else
            CMD=gradle
          fi
          $CMD :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      # При ошибке сборки сохраняем отчёты, чтобы было видно причину
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK and version
        id: prep
        run: |
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${{ github.run_number }}"
          TAG="v${VERSION}"
          APK_SRC=$(find app/build/outputs/apk -name '*.apk' -path '*debug*' | head -n1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::APK не найден в app/build/outputs/apk"
            exit 1
          fi
          mkdir -p output
          APK_NAME="${APP_NAME}-${TAG}.apk"
          cp "$APK_SRC" "output/${APK_NAME}"
          {
            echo "tag=${TAG}"
            echo "apk=output/${APK_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Готов файл: ${APK_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK-${{ steps.prep.outputs.tag }}
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.prep.outputs.apk }}
          generate_release_notes: true
          fail_on_unmatched_files: true
