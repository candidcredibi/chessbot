name: Build APK and Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Без этого релиз не создаётся (ошибка 403)
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ChessMaster
  # Версия релиза: v<MAJOR>.<MINOR>.<номер запуска>, например v1.0.7
  VERSION_MAJOR: 1
  VERSION_MINOR: 0

jobs:
  build:
    name: Build APK and publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (licenses accepted)
        uses: android-actions/setup-android@v3

      # В репозитории нет gradlew, поэтому версию Gradle определяем сами
      - name: Detect Gradle version
        id: gv
        run: |
          GV=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GV=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n1)
          fi
          if [ -z "$GV" ]; then
            AGP=$(grep -hE '^[[:space:]]*(agp|androidGradlePlugin|android-gradle-plugin)[[:space:]]*=' gradle/libs.versions.toml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
            echo "AGP: ${AGP:-не найден}"
            case "$AGP" in
              9.*) GV="9.1.0" ;;
              *)   GV="8.14.3" ;;
            esac
          fi
          echo "Gradle: $GV"
          echo "version=$GV" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      # Ключи для secrets-gradle-plugin (.env.example -> secrets.properties / local.properties / .env)
      - name: Prepare secrets and local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          : > /tmp/secrets.props
          if [ -f .env.example ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.example | cut -d= -f1 | while read -r k; do
              if [ "$k" = "GEMINI_API_KEY" ] && [ -n "$GEMINI_API_KEY" ]; then v="$GEMINI_API_KEY"; else v="DUMMY_VALUE"; fi
              echo "$k=$v" >> /tmp/secrets.props
            done || true
          fi
          if ! grep -q '^GEMINI_API_KEY=' /tmp/secrets.props; then
            echo "GEMINI_API_KEY=${GEMINI_API_KEY:-DUMMY_VALUE}" >> /tmp/secrets.props
          fi
          [ -f secrets.properties ] || cp /tmp/secrets.props secrets.properties
          [ -f .env ] || cp /tmp/secrets.props .env
          touch local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          cat /tmp/secrets.props >> local.properties
          echo "Ключи подготовлены (значения скрыты)."

      # Если нет app/google-services.json, плагин google-services упадёт: создаём заглушку
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          F=app/google-services.json
          if [ -f "$F" ]; then
            echo "google-services.json уже есть."
            exit 0
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$F"
            echo "google-services.json взят из секрета."
            exit 0
          fi
          B=$(ls app/build.gradle.kts app/build.gradle 2>/dev/null | head -n1)
          PKG=$(grep -hoE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]+"' "$B" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          [ -z "$PKG" ] && PKG=$(grep -hoE 'namespace[[:space:]]*=?[[:space:]]*"[^"]+"' "$B" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$PKG" ]; then
            echo "::warning::Не удалось определить applicationId, заглушка google-services.json не создана"
            exit 0
          fi
          SUF=$(grep -hoE 'applicationIdSuffix[[:space:]]*=?[[:space:]]*"[^"]+"' "$B" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          PKGS=$(printf '%s\n' "$PKG" "$PKG.debug" "${PKG}${SUF}" | sort -u)
          CLIENTS=""; i=0
          for P in $PKGS; do
            if [ -n "$CLIENTS" ]; then CLIENTS="$CLIENTS,"; fi
            CLIENTS="$CLIENTS{\"client_info\":{\"mobilesdk_app_id\":\"1:000000000000:android:000000000000000$i\",\"android_client_info\":{\"package_name\":\"$P\"}},\"api_key\":[{\"current_key\":\"dummy-api-key\"}]}"
            i=$((i+1))
          done
          printf '{"project_info":{"project_number":"000000000000","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[%s],"configuration_version":"1"}' "$CLIENTS" > "$F"
          echo "Создана заглушка google-services.json для: $PKGS"

      # Постоянный ключ подписи нужен, чтобы новые APK ставились поверх старых.
      # Положите base64 вашего debug.keystore в секрет DEBUG_KEYSTORE_BASE64.
      - name: Set up debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "debug.keystore взят из секрета."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            echo "debug.keystore восстановлен из debug.keystore.base64."
          elif [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "debug.keystore взят из репозитория."
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Сгенерирован новый debug.keystore."
          fi
          cp ~/.android/debug.keystore debug.keystore

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            CMD=./gradlew
          else
            CMD=gradle
          fi
          $CMD :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Prepare APK and version
        id: prep
        run: |
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${{ github.run_number }}"
          TAG="v${VERSION}"
          APK_SRC=$(find app/build/outputs/apk -name '*.apk' -path '*debug*' | head -n1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::APK не найден в app/build/outputs/apk"
            exit 1
          fi
          mkdir -p output
          APK_NAME="${APP_NAME}-${TAG}.apk"
          cp "$APK_SRC" "output/${APK_NAME}"
          {
            echo "tag=${TAG}"
            echo "apk=output/${APK_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Готов файл: ${APK_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK-${{ steps.prep.outputs.tag }}
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.prep.outputs.apk }}
          generate_release_notes: true
          fail_on_unmatched_files: true
